<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portals Monitor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-text">Portals<span class="brand-accent">Monitor</span></span>
    </div>
    <div class="topbar-sub" id="lastUpdate">оновлюється...</div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="overview">Огляд</button>
    <button class="tab" data-tab="arbitrage">Арбітраж</button>
    <button class="tab" data-tab="orders">Ордери</button>
  </nav>

  <main class="content">

    <!-- OVERVIEW TAB -->
    <section class="panel active" id="panel-overview">
      <div class="filters" id="rangeFilters">
        <button class="chip active" data-range="all">Усі</button>
        <button class="chip" data-range="0-3">0–3</button>
        <button class="chip" data-range="3-10">3–10</button>
        <button class="chip" data-range="10-20">10–20</button>
        <button class="chip" data-sort="volume">🔥 За обсягом</button>
      </div>
      <div class="list" id="overviewList">
        <div class="empty-state">Завантажую дані…</div>
      </div>
    </section>

    <!-- ARBITRAGE TAB -->
    <section class="panel" id="panel-arbitrage">
      <div class="panel-intro">
        <div class="panel-intro-title">Portals ⇄ MRKT</div>
        <div class="panel-intro-sub">Найвигідніший напрям купівлі з урахуванням комісій і виведення</div>
      </div>
      <div class="list" id="arbitrageList">
        <div class="empty-state">Завантажую…</div>
      </div>
    </section>

    <!-- ORDERS TAB -->
    <section class="panel" id="panel-orders">
      <div class="panel-intro">
        <div class="panel-intro-title">Офер → Floor</div>
        <div class="panel-intro-sub">Купівля через офер, продаж по floor, мінус комісія Portals</div>
      </div>
      <div class="list" id="ordersList">
        <div class="empty-state">Завантажую…</div>
      </div>
    </section>

  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
